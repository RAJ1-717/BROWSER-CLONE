<!DOCTYPE html>
<html lang="en">

<head>SS
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Homepage Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="top-bar">
    <nav class="top-links" aria-label="Top navigation">
      <a href="#about">About</a>
      <a href="#store">Store</a>
    </nav>
    <nav class="top-links right-links" aria-label="Account navigation">
      <a href="#gmail">Gmail</a>
      <a href="#images">Images</a>
      <a class="apps-link" href="#apps" aria-label="Apps">▦</a>
      <a class="sign-in" href="#sign-in">Sign in</a>
    </nav>
  </header>

  <main class="main-content">
    <h1 class="logo" aria-label="Google-style learning logo">
      <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span
        class="green">l</span><span class="red">e</span>
    </h1>

    <form class="search-form" role="search" action="#">
      <label class="visually-hidden" for="search-input">Search the web</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search-input" name="q" type="search" placeholder="Search or type a URL">
      <span class="mic-icon" aria-hidden="true" title="Microphone icon">🎙</span>
    </form>

    <div class="action-buttons">
      <button type="button">Google Search</button>
      <button type="button">I'm Feeling Lucky</button>
    </div>

    <p class="learning-note">A simple homepage made for an HTML &amp; CSS learning project.</p>
  </main>

  <footer class="footer">
    <div class="footer-country">India</div>
    <div class="footer-links">
      <nav aria-label="Footer information">
        <a href="#advertising">Advertising</a>
        <a href="#business">Business</a>
        <a href="#how-search-works">How Search works</a>
      </nav>
      <nav aria-label="Footer settings">
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
        <a href="#settings">Settings</a>
      </nav>
    </div>
  </footer>
</body>

</html>
